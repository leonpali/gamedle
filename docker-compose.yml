# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamedle
      POSTGRES_PASSWORD: gamedle
      POSTGRES_DB: gamedle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
